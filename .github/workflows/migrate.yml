name: Migrate database

# Render's free tier has no shell and no one-off jobs, so schema changes are
# applied from a GitHub runner against the production database.
#
# * `push` to main that adds/changes a revision applies `alembic upgrade head`
#   automatically, so a release never runs ahead of its schema.
# * A change to this workflow itself also runs it, so the first release after
#   adding it upgrades the live schema without waiting for a manual dispatch.
# * `workflow_dispatch` can also inspect the live revision (`current`) or verify
#   that models and database agree (`check`).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "upgrade | current | check"
        required: true
        default: upgrade
      revision:
        description: "Target revision for upgrade (empty = head)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/api/alembic/versions/**"
      - ".github/workflows/migrate.yml"

concurrency:
  group: migrate-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Alembic
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENVIRONMENT: development
          TELEGRAM_ADAPTER: mock
          COOKIE_SECURE: "false"
          ACTION: ${{ inputs.action || 'upgrade' }}
          REV: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is not set." >&2
            exit 1
          fi
          echo "Running: alembic ${ACTION} ${REV}"
          case "$ACTION" in
            upgrade) alembic upgrade "${REV:-head}"; alembic current -v ;;
            current) alembic current -v ;;
            check) alembic check ;;
            *) echo "Unknown action: $ACTION" >&2; exit 1 ;;
          esac
